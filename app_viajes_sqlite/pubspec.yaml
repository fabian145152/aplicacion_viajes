name: tu_app_gps
description: Aplicación de rastreo GPS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.0.0
  permission_handler: ^11.0.0 
  device_info_plus: ^10.0.0        # 🔥 ESTA FALTA
  wakelock_plus: ^1.1.0
  http: ^1.1.0
  url_launcher: ^6.2.5   # <--- 🔴 AGREGA ESTA LÍNEA
  webview_flutter: ^4.10.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  